<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Wira Bahasa: Kuasa Menulis</title>
<style>
:root{--bg1:#dff1ff;--bg2:#e6f7d6;--card:#fff;--ink:#12305a;--blue:#1769c9;--org:#f08a00;--yel:#ffd43b;--grn:#2e9e4f;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f2744;--bg2:#12361f;--card:#1b2a44;--ink:#f1f6ff;--blue:#6db3ff;--org:#ffb347;--yel:#ffd43b;--grn:#6fdc8c;--bad:#ff9d6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0f2744;--bg2:#12361f;--card:#1b2a44;--ink:#f1f6ff;--blue:#6db3ff;--org:#ffb347;--grn:#6fdc8c;--bad:#ff9d6e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",Verdana,sans-serif;font-size:22px;line-height:1.5;color:var(--ink);background:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--blue);color:#fff}
header b{font-size:20px}header button{font-size:16px;padding:6px 12px}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:4px solid var(--org);border-radius:22px;padding:18px;margin-bottom:14px}
h1{font-size:34px;margin:.2em 0;color:var(--org)}h2{font-size:28px;margin:.2em 0;color:var(--blue)}
button{font:inherit;font-weight:bold;border:0;border-radius:16px;padding:12px 22px;margin:6px 6px 6px 0;background:var(--blue);color:#fff;cursor:pointer;min-height:52px}
button.o{background:var(--org);color:#222}button.g{background:var(--grn);color:#082a12}button.y{background:var(--yel);color:#222}
button:disabled{opacity:.45;cursor:not-allowed}button.sel{outline:5px solid var(--yel)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--org);outline-offset:2px}
input[type=text],textarea{font:inherit;font-size:26px;padding:8px 12px;border:3px solid var(--blue);border-radius:12px;background:#fff;color:#12305a;max-width:100%}
input.l{width:90px;text-align:center}input.w{width:min(100%,520px)}textarea{width:100%;min-height:90px}
.pic{font-size:84px;text-align:center;background:#fff8d6;border-radius:18px;padding:10px;color:#222}
.pic small{display:block;font-size:14px}
.word{font-size:48px;letter-spacing:6px;text-align:center;font-weight:bold}
.fb{min-height:2em;padding:10px 14px;border-radius:14px;margin:8px 0;font-weight:bold}
.ok{background:#d8f5df;color:#0b4a1f}.try{background:#fff0d0;color:#6b3a00}
.bob{display:flex;gap:12px;align-items:flex-start}.bob .av{font-size:56px;flex:none}
.zone{min-height:70px;border:3px dashed var(--blue);border-radius:14px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--yel);color:#222;border-radius:12px;padding:8px 16px;font-weight:bold;cursor:grab;border:2px solid var(--org);font-size:26px}
.stars{font-size:24px}.dots{display:flex;gap:6px;margin-bottom:8px}.dots i{width:34px;height:14px;border-radius:8px;background:#b9c9dd;display:block}.dots i.on{background:var(--grn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.note{font-size:16px;opacity:.85}label{display:block;margin:6px 0}
@media print{header,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#000}}
</style></head><body>
<header><b>🌟 Misi Wira Bahasa</b><span class="stars" id="stars" aria-live="polite">⭐ 0</span>
<span><button class="o" onclick="go('menu')">Menu Utama</button></span></header>
<main id="app"></main>
<script>
const A=document.getElementById('app');
let st={star:0,sound:true,av:'🦸',unlock:1,lvl:{},ans:{},refl:{},chk:{}};
const $=s=>document.querySelector(s);
function speak(t){return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function tog(){st.sound=!st.sound;$('#snd').textContent='🔊 Bunyi: '+(st.sound?'Hidup':'Mati');if(!st.sound)try{speechSynthesis.cancel()}catch(e){}}
function star(n){st.star+=n||1;$('#stars').textContent='⭐ '+st.star}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const tableSvg='<svg width="110" height="80" viewBox="0 0 110 80" role="img" aria-label="meja"><rect x="5" y="15" width="100" height="14" rx="4" fill="#b5651d"/><rect x="14" y="29" width="10" height="44" fill="#8a4b12"/><rect x="86" y="29" width="10" height="44" fill="#8a4b12"/></svg>';
function say(){return ''}
function boby(t){return `<div class="bob"><div class="av" title="BoBoiBoy (ruang ilustrasi)">🧢</div><div><b>BoBoiBoy:</b> ${t}</div></div>`}
function dots(n,t){return `<div class="dots" aria-label="Soalan ${n+1} daripada ${t}">`+Array.from({length:t},(_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')+'</div>'}
function fb(c,m){const e=$('#fb');e.className='fb '+c;e.textContent=m}
function go(s,a){scrollTo(0,0);try{speechSynthesis.cancel()}catch(e){}A.innerHTML=S[s](a||0)}
const story=["Hebat! Satu Kuasa Bahasa sudah pulih. Pintu pusat latihan wira terbuka!","Bagus! Kuasa Bahasa kedua menyala. Laluan ke sekolah terbuka!","Hebat! Kuasa ketiga menyinari pulau. Misi terakhir menanti!"];
function next(m){return m<4?`<div class="card ok"><b>Cerita seterusnya:</b> ${story[m-1]}</div><button class="g" onclick="st.unlock=Math.max(st.unlock,${m+1});go('m${m+1}')">Seterusnya</button>`:`<div class="card ok">Semua Kuasa Bahasa sudah terkumpul!</div><button class="g" onclick="go('rumusan')">Seterusnya</button>`}
const M1=[{e:'📖',c:'📖',w:'buku',i:1,a:'u'},{e:'⚽',c:'⚽',w:'bola',i:2,a:'l'},{e:'T',c:tableSvg,w:'meja',i:1,a:'e'}];
const M2=[{c:['membaca','Ali','buku.'],a:'Ali membaca buku.'},{c:['bola.','bermain','Siti'],a:'Siti bermain bola.'},{c:['menyiram','Ibu','bunga.'],a:'Ibu menyiram bunga.'}];
const M3=[{p:'🧒📖',t:'Seorang murid membaca buku.',h:['membaca','buku'],g:['Ali membaca ',' .'],m:['Ali ',' buku.'],s:'Ali membaca buku.'},
{p:'🧒🧒🧹',t:'Dua orang murid membersihkan kelas.',h:['membersihkan','kelas'],g:['Dua orang murid membersihkan ','.'],m:['Dua orang murid ',' kelas.'],s:'Dua orang murid membersihkan kelas.'},
{p:'🧒🎁➡️👩‍🏫',t:'Seorang murid menyerahkan barang yang dijumpai kepada guru.',h:['menyerahkan','guru','buku'],g:['Murid itu menyerahkan buku kepada ','.'],m:['Murid itu ',' buku kepada guru.'],s:'Murid itu menyerahkan buku kepada guru.'}];
function chkSent(s){s=s.trim();if(!s)return['try','Mari tulis satu ayat dahulu. Kamu boleh cuba!'];if(!/^[A-Z]/.test(s))return['try','Mari semak huruf besar.'];if(!/[.!?]$/.test(s))return['try','Semak tanda noktah sebelum meneruskan misi.'];return['ok','Ayat kamu sudah mempunyai makna. Bagus, kamu sudah mencuba!']}
const S={
menu(){return `<div class="card"><h1>Misi Wira Bahasa: Kuasa Menulis</h1>${boby('Salam, Wira Bahasa! Mari bantu saya mengumpulkan Kuasa Bahasa. Kita akan melengkapkan perkataan, menyusun ayat dan menulis idea sendiri!')}${say('Salam, Wira Bahasa! Mari bantu saya mengumpulkan Kuasa Bahasa. Kita akan melengkapkan perkataan, menyusun ayat dan menulis idea sendiri!')}
<p>Pilih avatar (tanpa nama sebenar):</p>${['🦸','🦊','🐯','🚀'].map(a=>`<button class="${st.av==a?'sel':''}" onclick="st.av='${a}';go('menu')" aria-label="Avatar ${a}">${a}</button>`).join('')}
<div><button class="g" onclick="go('objektif')">Mula</button></div></div>
<div class="card"><h2>Pulau Kuasa Bahasa</h2><div class="grid">${[1,2,3,4].map(i=>`<button ${st.unlock<i?'disabled':''} class="${st.unlock<i?'':'o'}" onclick="go('m${i}')">${st.unlock<i?'🔒':'🏝️'} Misi ${i}</button>`).join('')}</div>
<button onclick="go('guru')" class="y">📋 Halaman Guru</button></div>`},
objektif(){return `<div class="card"><h2>🎯 Objektif</h2><p><b>SP 3.2.1:</b> Membina dan menulis perkataan, frasa dan ayat.</p><p>Pada akhir pembelajaran, saya dapat:</p><ul><li>melengkapkan tiga perkataan,</li><li>menyusun tiga ayat mudah,</li><li>menulis satu ayat bermakna berdasarkan gambar.</li></ul>${say('Hari ini kita melengkapkan perkataan, menyusun ayat dan menulis ayat sendiri.')}<button class="g" onclick="go('contoh')">Seterusnya</button></div>`},
panduan(){return `<div class="card"><h2>🎮 Panduan Permainan</h2><ul><li>Baca arahan dengan teliti.</li><li>Taip jawapan, kemudian tekan <b>Semak</b>.</li><li>Salah? Tekan <b>Cuba Lagi</b>. Markah tidak hilang.</li><li>Bintang diberi kerana usaha, bukan kerana laju.</li><li>Tiada had masa dan tiada papan kedudukan.</li><li>Kad ayat: seret kad, atau ketik kad.</li></ul>${say('Taip jawapan, kemudian tekan Semak. Kalau salah, tekan Cuba Lagi. Tiada had masa.')}<button class="g" onclick="go('contoh')">Seterusnya</button></div>`},
contoh(){return `<div class="card"><h2>👀 Contoh Berpandu</h2>${boby('Lihat cara saya melakukannya!')}<div class="pic">📖<small>(ruang ilustrasi: buku)</small></div><p class="word">b _ k u</p><p>1. Sebut: b-u-k-u. 2. Huruf yang tertinggal ialah <b>u</b>. 3. Tulis: <b>buku</b>.</p><p>Ayat: <b>A</b>li membaca buku<b>.</b> (huruf besar di awal, noktah di akhir)</p>${say('Gambar buku. Huruf yang tertinggal ialah u. Perkataan ini ialah buku.')}<button class="g" onclick="go('m1')">Seterusnya</button></div>`},
m1(i){const q=M1[i],w=q.w.split('');const wd=w.map((c,k)=>k==q.i?'_':c).join(' ');return `<div class="card"><h2>Misi 1: Lengkapkan Perkataan</h2>${dots(i,3)}<div class="pic">${q.c}<small>(ruang ilustrasi)</small></div><p class="word">${wd}</p>
<p>Taip huruf yang tertinggal: <input id="a" class="l" type="text" maxlength="1" autocomplete="off" aria-label="Huruf tertinggal"></p><p id="step2" hidden>Tulis semula perkataan itu: <input id="b" class="w" type="text" autocomplete="off" aria-label="Tulis perkataan"> <button onclick="m1b(${i})">Semak</button></p>
<div id="fb" class="fb" aria-live="polite"></div>${say('Taip huruf yang tertinggal.')}<button class="g" id="sm" onclick="m1a(${i})">Semak</button><button class="o" onclick="$('#a').value='';$('#a').focus();fb('','')">Cuba Lagi</button><span id="nx"></span></div>`},
m2(i){const q=M2[i];return `<div class="card"><h2>Misi 2: Susun dan Tulis Ayat</h2>${dots(i,3)}<p>Seret atau ketik kad untuk menyusun ayat.</p><div id="pool" class="zone" ondragover="event.preventDefault()" ondrop="drop(event,'pool')"></div><p>Ayat saya:</p><div id="ans" class="zone" ondragover="event.preventDefault()" ondrop="drop(event,'ans')"></div>
<p id="step2" hidden>Taip ayat itu. Ingat: huruf besar di awal dan noktah di akhir.<br><input id="b" class="w" type="text" autocomplete="off" aria-label="Tulis ayat"> <button onclick="m2b(${i})">Semak</button></p><div id="fb" class="fb" aria-live="polite"></div>${say('Susun kad perkataan menjadi ayat. Ingat huruf besar dan noktah.')}<button class="g" onclick="m2a(${i})">Semak</button><button class="o" onclick="initM2(${i})">Cuba Lagi</button><span id="nx"></span></div>`},
m3(i){const q=M3[i];return `<div class="card"><h2>Misi 3: Lihat Gambar, Bina Ayat</h2>${dots(i,3)}<div class="pic">${q.p}<small>${q.t} (ruang ilustrasi)</small></div><p>Perkataan bantuan: ${q.h.map(h=>`<span class="chip" style="cursor:default">${h}</span>`).join(' ')}</p><p>Pilih bantuan:</p><button onclick="lvl(${i},'berpandu')">Aras berpandu</button><button onclick="lvl(${i},'sederhana')">Aras sederhana</button><button onclick="lvl(${i},'kendiri')">Aras kendiri</button><div id="work"></div><div id="fb" class="fb" aria-live="polite"></div>${say(q.t+'. Bina satu ayat.')}<span id="nx"></span></div>`},
m4(i){const P=[['Kamu menjumpai sebuah buku di dalam kelas. Apakah yang patut kamu lakukan? Tulis satu ayat.','Contoh: Saya menyerahkan buku itu kepada guru.','🧠 Pemikiran kritis'],['Cadangkan satu cara membantu rakan mencari barang yang hilang.','Contoh: Saya akan bertanya kepada kawan-kawan.','💡 Pemikiran kreatif']][i];return `<div class="card"><h2>Misi 4: Kuasa Idea dan Amanah</h2>${dots(i,2)}<b>${P[2]}</b><p>${P[0]}</p><p class="note">Cakap idea kamu dahulu, kemudian tulis dengan bimbingan.</p><p>Saya akan <input id="b" class="w" type="text" autocomplete="off" aria-label="Sambung ayat"> .</p><div id="fb" class="fb" aria-live="polite"></div>${say(P[0])}<button class="g" onclick="m4a(${i},'${P[1].replace("'","&#39;")}')">Semak</button><button class="o" onclick="$('#b').value='';fb('','')">Cuba Lagi</button><span id="nx"></span></div>`},
rumusan(){return `<div class="card"><h2>📝 Rumusan</h2><p>Kamu telah:</p><ul><li>melengkapkan perkataan,</li><li>menyusun ayat,</li><li>membina ayat daripada gambar,</li><li>menulis idea sendiri.</li></ul><p>Bintang usaha: <b>⭐ ${st.star}</b></p><p class="note">Sekarang ambil kertas dan tulis tiga ayat dengan pensel. Guru akan menyemak tulisan tangan kamu.</p><button class="g" onclick="go('refleksi')">Seterusnya</button></div>`},
refleksi(){const R=['Saya boleh menulis perkataan.','Saya boleh menyusun ayat.','Saya boleh menulis ayat sendiri.'];return `<div class="card"><h1>🏆 Tahniah, Wira Bahasa!</h1><p>Kamu telah menggunakan Kuasa Menulis. Teruskan menulis dengan teliti dan jujur!</p>${say('Tahniah, Wira Bahasa! Kamu telah menggunakan Kuasa Menulis. Teruskan menulis dengan teliti dan jujur!')}<h2>Refleksi</h2>${R.map((r,k)=>`<p>${r}<br><button class="${st.refl[k]==1?'g':''}" onclick="st.refl[${k}]=1;go('refleksi')">😊 Ya</button><button class="${st.refl[k]==2?'o':''}" onclick="st.refl[${k}]=2;go('refleksi')">🌱 Masih belajar</button></p>`).join('')}<button class="o" onclick="go('menu')">Menu Utama</button></div>`},
guru(){const C=['Murid melengkapkan perkataan dengan betul.','Murid menyusun perkataan menjadi ayat bermakna.','Murid membina ayat berdasarkan gambar.','Murid menggunakan huruf besar dan tanda noktah.','Murid menulis sendiri dengan tahap bantuan yang direkodkan.'];return `<div class="card"><h2>📋 Halaman Guru</h2><p class="note">Bahan pendidikan tidak rasmi. Tiada nama penuh, gambar atau maklumat peribadi murid dikumpulkan; gunakan avatar atau nama samaran.</p><h3>Senarai semak</h3>${C.map((c,k)=>`<label><input type="checkbox" ${st.chk[k]?'checked':''} onchange="st.chk[${k}]=this.checked"> ${c}</label>`).join('')}<h3>Tahap bantuan Misi 3 (direkodkan)</h3><p>${[0,1,2].map(k=>`Gambar ${k+1}: <b>${st.lvl[k]||'belum dicuba'}</b>`).join(' &nbsp; ')}</p><h3>Jawapan terbuka (semak oleh guru)</h3><p>${['m3-0','m3-1','m3-2','m4-0','m4-1'].map(k=>`${k}: ${esc(st.ans[k]||'-')}`).join('<br>')}</p><p class="note">Jawapan terbuka tidak dinilai berdasarkan padanan satu ayat contoh. Nilai kesesuaian dengan gambar, kejelasan ayat, huruf besar dan noktah.</p><h3>Aktiviti kertas (wajib)</h3><p>Murid menyalin tiga ayat daripada Misi 2 pada kertas bergaris. Nilai pembentukan huruf, jarak perkataan dan kekemasan. Menaip sahaja tidak mencukupi untuk menilai tulisan tangan.</p><h3>Rekod aset dan kebenaran</h3><p class="note">Ilustrasi: emoji sistem dan lukisan SVG ringkas. Ruang ilustrasi disediakan untuk aset watak BoBoiBoy; masukkan hanya aset yang dibekalkan atau berkebenaran, dan catat sumber di sini. Bahan ini tidak mengandungi bunyi atau muzik.</p><button class="g noprint" onclick="print()">🖨️ Cetak</button><button class="o noprint" onclick="go('menu')">Menu Utama</button></div>`}};
function done(m,i,t){$('#nx').innerHTML=i+1<t?`<button class="g" onclick="go('m${m}',${i+1})">Seterusnya</button>`:`</span>`;if(i+1>=t)$('#nx').outerHTML='<div id="nx">'+next(m)+'</div>'}
function m1a(i){const q=M1[i],v=$('#a').value.trim().toLowerCase();if(!v)return fb('try','Taip satu huruf dahulu.');if(v==q.a){fb('ok',`Tepat! Perkataan ini ialah ‘${q.w}’. Sekarang, tulis perkataan itu.`);speak(q.w);$('#step2').hidden=false;$('#sm').disabled=true;$('#b').focus()}else{fb('try','Hampir berjaya! Baca perkataan ini dan cuba sekali lagi.');speak(q.w)}}
function m1b(i){const q=M1[i],v=$('#b').value.trim();if(v.toLowerCase()==q.w){star(1);fb('ok','Bagus, kamu sudah mencuba! ⭐');done(1,i,3)}else fb('try','Hampir berjaya! Tulis perkataan penuh: baca dan cuba lagi.')}
let cur=[];function initM2(i){cur=M2[i].c.map((w,k)=>({w,k,on:false}));drawM2();fb('','');$('#step2').hidden=true}
function drawM2(){const mk=c=>`<span class="chip" draggable="true" tabindex="0" role="button" ondragstart="event.dataTransfer.setData('t','${c.k}')" onclick="flip(${c.k})" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();flip(${c.k})}">${c.w}</span>`;$('#pool').innerHTML=cur.filter(c=>!c.on).map(mk).join('');$('#ans').innerHTML=cur.filter(c=>c.on).sort((a,b)=>a.o-b.o).map(mk).join('')}
let ord=0;function flip(k){const c=cur[k];c.on=!c.on;c.o=++ord;drawM2()}
function drop(e,z){e.preventDefault();const k=+e.dataTransfer.getData('t');const c=cur[k];if(!c)return;c.on=z=='ans';c.o=++ord;drawM2()}
function m2a(i){const s=cur.filter(c=>c.on).sort((a,b)=>a.o-b.o).map(c=>c.w).join(' ');if(cur.some(c=>!c.on))return fb('try','Gunakan semua kad perkataan dahulu.');if(s==M2[i].a){fb('ok','Tepat! Sekarang tulis ayat itu.');speak(s);$('#step2').hidden=false;$('#b').focus()}else fb('try','Hampir berjaya! Baca ayat ini dan cuba sekali lagi.')}
function m2b(i){const v=$('#b').value.trim();if(v==M2[i].a){star(1);fb('ok','Bagus, kamu sudah mencuba! ⭐');done(2,i,3)}else{const r=chkSent(v);fb(r[0]=='ok'?'try':r[0],r[0]=='ok'?'Hampir berjaya! Semak ejaan dan susunan perkataan.':r[1])}}
function lvl(i,l){st.lvl[i]=l;const q=M3[i];let h;if(l=='kendiri')h=`<p>Tulis satu ayat sendiri:</p><textarea id="b" aria-label="Ayat saya"></textarea>`;else{const f=l=='berpandu'?q.g:q.m;h=`<p>${f[0]}<input id="b" class="l" style="width:200px" type="text" autocomplete="off" aria-label="Isi tempat kosong"> ${f[1].trim()}</p>`}$('#work').innerHTML=h+`<button class="g" onclick="m3a(${i},'${l}')">Semak</button><button class="o" onclick="lvl(${i},'${l}');fb('','')">Cuba Lagi</button>`;fb('','')}
function m3a(i,l){const q=M3[i],v=$('#b').value.trim();let s=v;if(l!='kendiri'){const f=l=='berpandu'?q.g:q.m;s=(f[0]+v+f[1]).replace(/\s+\./,'.').replace(/\s+/g,' ').trim()}if(!v)return fb('try','Mari tulis dahulu. Kamu boleh cuba!');const r=chkSent(s);st.ans['m3-'+i]=s;fb(r[0],r[1]+(r[0]=='ok'?` Contoh jawapan: ${q.s} Guru akan menyemak ayat kamu.`:''));if(r[0]=='ok'){star(1);done(3,i,3)}}
function m4a(i,ex){const v=$('#b').value.trim();if(!v)return fb('try','Mari tulis idea kamu dahulu. Kamu boleh cuba!');const s='Saya akan '+v.replace(/[.]$/,'')+'.';st.ans['m4-'+i]=s;fb('ok','Ayat kamu sudah mempunyai makna. '+ex+' Guru akan menilai idea dan kejelasan ayat kamu.');star(1);done(4,i,2)}
const _go=go;go=function(s,a){_go(s,a);if(s=='m2')initM2(a||0)};
go('menu');
</script></body></html>
